name: Android APKs

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ardupilot
            name: ArduPilot
            gradle_flavor: Ardupilot
            apk: ap-sitl-release.apk
          - app: px4
            name: PX4
            gradle_flavor: Px4
            apk: px4-sih-release.apk
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ matrix.app }}
      GRADLE_FLAVOR: ${{ matrix.gradle_flavor }}
      APK_NAME: ${{ matrix.apk }}
      VERSION_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.1.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.13846066
            cmake;3.22.1

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build ccache pkg-config patch zip unzip
          python -m pip install -r "$APP/src/requirements.txt"

      - name: Build native libraries
        working-directory: ${{ matrix.app }}
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./src/build.sh "-DANDROID_NDK=$ANDROID_HOME/ndk/29.0.13846066"

      - name: Prepare signing directory
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf 'ANDROID_KEYSTORE_PATH=%s/signing/keystore.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Prepare disposable PR signing key
        if: github.event_name == 'pull_request'
        run: |
          umask 077
          ANDROID_KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          ANDROID_KEY_PASSWORD=$(openssl rand -hex 32)
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -alias ci -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=Disposable CI build"
          {
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=ci\n'
          } >> "$GITHUB_ENV"

      - name: Decode release signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${SIGNING_KEYSTORE:?Missing signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing store password secret}"
          : "${ANDROID_KEY_ALIAS:?Missing key alias secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password secret}"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          {
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew ":app:assemble${GRADLE_FLAVOR}Release" ":app:lint${GRADLE_FLAVOR}Release" \
            -PsigningFlavor="$APP" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="${VERSION_NAME#v}" \
            --no-daemon --no-configuration-cache --console=plain

      - name: Verify and stage signed APK
        run: |
          apk="android/app/build/outputs/apk/$APP/release/app-$APP-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          mkdir -p artifacts
          cp "$apk" "artifacts/$APK_NAME"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/keystore.jks"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.app }}-release-apk
          path: artifacts/${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish-release:
    name: Attach APKs to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-release-apk'
          merge-multiple: true
          path: artifacts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            artifacts/ap-sitl-release.apk \
            artifacts/px4-sih-release.apk --clobber
